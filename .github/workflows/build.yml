name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          NDK=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          CMAKE=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
