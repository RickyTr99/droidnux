name: Build

on:
  push:
    branches: [main, phase*]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host tools
        run: sudo apt-get update -q && sudo apt-get install -y -q bison ccache

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          NDK=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          CMAKE=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager --install "ndk;$NDK" "cmake;$CMAKE" "platforms;android-37.0" "build-tools;36.1.0" > /dev/null

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache  # ccache 4 default location
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-main-

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          DROIDNUX_CCACHE: ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          ./gradlew assembleDebug --console=plain
          ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
