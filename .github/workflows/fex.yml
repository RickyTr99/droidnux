name: FEX component

# FEX-Emu and its GL/Vulkan thunks for the container (guest/fex), built natively
# on an arm64 runner inside the Debian release the app installs. Tags named
# fex-<version>-dn<revision> publish the archive as a GitHub release the app
# downloads from.

on:
  push:
    branches: [main, phase*]
    paths: [guest/fex/**, guest/mesa/**, guest/va/**, guest/kwin-pacing/droidnux-qt-animations.c, .github/workflows/fex.yml]
    tags: [fex-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DROIDNUX_FEX_DEPS: install
          DROIDNUX_MESA_DEPS: install
        run: sh guest/fex/build.sh "$RUNNER_TEMP/fex" out

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-fex-arm64
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/fex-')
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          . guest/fex/version.sh
          test "$GITHUB_REF_NAME" = "fex-${FEX_VERSION#FEX-}-dn$DROIDNUX_REVISION"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: FEX ${{ github.ref_name }}
          body: FEX-Emu with its GL and Vulkan thunks for the DroidNux container, built from guest/fex. x86 and x86-64 programs run through it; GL and Vulkan reach the arm64 Mesa.
