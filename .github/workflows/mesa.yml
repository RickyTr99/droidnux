name: Mesa component

# Turnip + Zink + the VA-API driver for the container (guest/mesa, guest/va). Built natively on an arm64
# runner, inside the Debian release the app installs, so it links against the
# same libraries the guest has. Tags named mesa-<version>-dn<revision> publish
# the archive as a GitHub release the app downloads from.

on:
  push:
    branches: [main, phase*]
    paths: [guest/mesa/**, guest/va/**, display/src/main/cpp/core/video_protocol.h, .github/workflows/mesa.yml]
    tags: [mesa-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DROIDNUX_MESA_DEPS: install
        run: sh guest/mesa/build.sh "$RUNNER_TEMP/mesa" out

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-mesa-arm64
          path: out/*
          if-no-files-found: error

  # The same Mesa as a Flatpak GL extension, against each supported branch of the Freedesktop runtime.
  flatpak:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        branch: ['25.08', '26.08']
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          # Ubuntu keeps unprivileged user namespaces, which bwrap builds the sandbox with, behind AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build
        run: sh guest/mesa/flatpak.sh ${{ matrix.branch }} out

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-mesa-flatpak-${{ matrix.branch }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mesa-')
    needs: [build, flatpak]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          . guest/mesa/version.sh
          test "$GITHUB_REF_NAME" = "mesa-$MESA_VERSION-dn$DROIDNUX_REVISION"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: Mesa ${{ github.ref_name }}
          body: Turnip (KGSL), Zink and the VA-API driver for the DroidNux container, built from guest/mesa and guest/va, and the same Mesa as the Flatpak GL extension org.freedesktop.Platform.GL.droidnux.
