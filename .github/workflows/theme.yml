name: Theme component

# Papirus icons with their caches and scaled Arc-Dark window borders for the
# container (guest/theme). Built inside the Debian release the app installs.
# Tags named theme-<papirus version>-dn<revision> publish the archive as a
# GitHub release the app downloads from.

on:
  push:
    branches: [main, phase*]
    paths: [guest/theme/**, .github/workflows/theme.yml]
    tags: [theme-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          DROIDNUX_THEME_DEPS: install
        run: sh guest/theme/build.sh "$RUNNER_TEMP/theme" out

      - uses: actions/upload-artifact@v4
        with:
          name: droidnux-theme
          path: out/*
          if-no-files-found: error

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/theme-')
        run: |
          . guest/theme/version.sh
          test "$GITHUB_REF_NAME" = "theme-${PAPIRUS_DEB%-*}-dn$DROIDNUX_REVISION"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/theme-')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: Theme ${{ github.ref_name }}
          body: Papirus icons (with icon caches) and scaled Arc-Dark window borders for the DroidNux container, built from guest/theme.
